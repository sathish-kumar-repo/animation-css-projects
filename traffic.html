<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: black;
        width: 100vw;
        height: 100vh;
        display: grid;
        place-items: center;
      }

      .light {
        width: 100px;
        height: 100px;
        border-radius: 50%;

        opacity: 0.2;

        animation: traffic 3s infinite;
      }

      .traffic-light {
        width: 150px;
        background-color: darkslategray;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 30px;
        border-radius: 25px;
        border: 5px solid gray;
      }

      .red {
        background-color: red;
        box-shadow: 0 0 30px red;
        animation-delay: 0s;
      }

      .yellow {
        background-color: yellow;
        box-shadow: 0 0 30px yellow;
        animation-delay: 1s;
      }

      .green {
        background-color: lime;
        box-shadow: 0 0 30px lime;
        animation-delay: 2s;
      }

      @keyframes traffic {
        0%,
        30% {
          opacity: 1;
          transform: scale(1.1);
        }
        
        31%,
        100% {
          opacity: 0.2;
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <div class="traffic-light">
      <div class="light red"></div>
      <div class="light yellow"></div>
      <div class="light green"></div>
    </div>
  </body>
</html>
